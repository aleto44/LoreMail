name = "loremail-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false
[[kv_namespaces]]
binding = "KV"
id = "a3907b098fe04b7bad614831b6138338"
preview_id = "67aed69072ed41b3b9f9807de578b699"
[dev]
port = 8787
local_protocol = "http"
# ── Production vars — used by `wrangler deploy` (no --env flag) ───────────────
[vars]
ENVIRONMENT = "production"
PWA_URL = "https://aleto44.github.io/LoreMail"
WORKER_URL = "https://loremail-worker.amix.workers.dev"
# Push notification secrets — set these once with `wrangler secret put`:
#   VAPID_PUBLIC_KEY   base64url raw EC P-256 public key (65 bytes)
#   VAPID_PRIVATE_KEY  JWK JSON string of EC P-256 private key
#   VAPID_SUBJECT      e.g. mailto:admin@loremail.app
# Generate with: node scripts/generate-vapid-keys.mjs (from repo root)

# ── Local development vars — used by `wrangler dev` ───────────────────────────
[env.development.vars]
ENVIRONMENT = "development"
PWA_URL = "http://localhost:5173"
WORKER_URL = "http://localhost:8787"
