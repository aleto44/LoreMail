name: Deploy Launcher

on:
  push:
    branches: [main]
    paths:
      - 'apps/launcher/**'
      - '.github/workflows/deploy-launcher.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build launcher
        run: npm run build --workspace=apps/launcher

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/launcher/dist
          destination_dir: launcher
          keep_files: true
